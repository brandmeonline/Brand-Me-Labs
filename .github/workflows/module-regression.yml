name: Module Regression

on:
  # `push` is scoped to the long-lived branches on purpose. It fires on
  # refs/heads/<branch> while `pull_request` fires on refs/pull/N/merge, so a
  # wildcard here makes every PR branch build twice, concurrently, on the same
  # SHA. A `concurrency:` group does NOT dedupe that — github.ref differs, so
  # the two runs land in different groups. Mirrors chain-tests.yml:10-11.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `version:` here — package.json's `packageManager` field is the
      # single source of truth. action-setup@v4 errors out if both are set.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run module regression suite
        env:
          REGRESSION_TIMEOUT: 900
        run: bash scripts/regression/run_all.sh
