# Hard gate for the ported Lux foundation (brandme_foundation/).
#
# Unlike ci-cd.yml's test-core job, no step here is suffixed with `|| echo`.
# The foundation carries Lux's tenant-isolation and fail-closed-config
# invariants; a green run has to mean they actually hold.
name: Foundation

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the foundation contract
        run: |
          python -m pip install --upgrade pip
          pip install -r brandme_foundation/requirements.txt
          pip install pytest pytest-asyncio

      - name: Foundation test suite
        run: pytest tests/foundation -v

      - name: Every foundation module imports standalone
        run: |
          python - <<'EOF'
          import importlib
          for module in (
              "brandme_foundation",
              "brandme_foundation.errors",
              "brandme_foundation.observability",
              "brandme_foundation.runtime.config",
              "brandme_foundation.runtime.http",
              "brandme_foundation.runtime.health",
              "brandme_foundation.tenancy.models",
              "brandme_foundation.hooks",
              "brandme_foundation.hooks.broker",
              "brandme_foundation.hooks.events",
              "brandme_foundation.gates",
          ):
              importlib.import_module(module)
              print("ok", module)
          EOF

      - name: No source-repo imports leaked through the port
        run: |
          if grep -rnE '^\s*(from|import) (services|compass_mcp|protocols|graph|hooks|gates|eval|web)\b' \
               brandme_foundation tests/foundation; then
            echo "::error::an unported Lux import path survived in the foundation"
            exit 1
          fi
          echo "no unported import paths"
