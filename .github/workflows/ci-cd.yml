#
# CI/CD Pipeline for Brand.Me Platform
# =====================================

name: Build, Test, and Deploy

on:
  # `push` is scoped to the long-lived branches on purpose. It fires on
  # refs/heads/<branch> while `pull_request` fires on refs/pull/N/merge, so
  # listing feature branches here makes every PR build the whole pipeline
  # twice, concurrently, on the same SHA. The two runs do not carry the same
  # token — GitHub restricts security-events:write on pull_request runs — so
  # they can disagree, and whichever finishes last is the result shown.
  # A `concurrency:` group does NOT dedupe them: github.ref differs, so they
  # land in different groups. Mirrors chain-tests.yml:10-11.
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

# Least privilege by default. security-events:write is what
# codeql-action/upload-sarif needs; without it the Security Scan job fails
# with "Resource not accessible by integration" after Trivy has already
# scanned clean.
permissions:
  contents: read
  security-events: write

# An explicit `shell: bash` runs steps as `bash -eo pipefail`; the implicit default is `bash -e` without
# pipefail, under which `cmd | tee log` reports tee's status and hides a failing cmd.
defaults:
  run:
    shell: bash

env:
  GCP_PROJECT_ID: lux-realestate-app
  GCP_REGION: us-east1
  GKE_CLUSTER: brandme-cluster
  REGISTRY: gcr.io

jobs:
  # ==========================================
  # Lint and Test
  # ==========================================


  test-gateway:
    name: Test Gateway (Node/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
      BRANDME_REQUIRE_EMULATORS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for identity database migrations
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: pip install --require-hashes -r scripts/python/requirements.lock

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        
      - name: Install dependencies
        working-directory: ./brandme-gateway
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./brandme-gateway
        run: pnpm lint

      - name: Type check
        working-directory: ./brandme-gateway
        run: pnpm type-check

      - name: Run tests
        working-directory: ./brandme-gateway
        run: pnpm exec vitest run

  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --filter brandme-frontend...
      - name: Reject production and critical dependency advisories
        run: |
          pnpm audit --prod
          pnpm audit --audit-level=critical
      - name: Build frontend with lint and type checks
        run: pnpm --filter brandme-frontend build

  test-core:
    name: Test Core (Python/FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
          - 9020:9020
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
      # REST endpoint for the migration-ledger suite (tests/test_commerce_migrations.py).
      SPANNER_EMULATOR_REST: http://localhost:9020
    steps:
      - uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install --require-hashes -r scripts/python/requirements.lock

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"

      - name: Start pinned Firestore emulator (projections + rules)
        run: |
          launcher=$(python scripts/python/fetch_firestore_emulator.py .cache/firestore-emulator)
          nohup "$launcher" start --host=127.0.0.1 --port=8080 > .cache/firestore-emulator.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          python -c "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=10).close()"

      # Every test under tests/, once. Known-broken tests are quarantined (owner + blocker) in tests/conftest.py
      # and listed in the QUARANTINED block of the summary; with BRANDME_REQUIRE_EMULATORS=1 any other skip fails.
      - name: Test full Python suite (tests/)
        env:
          PUBSUB_EMULATOR_BIN: .cache/pubsub-emulator/platform/pubsub-emulator/bin/cloud-pubsub-emulator
          GCS_EMULATOR_BIN: .cache/gcs-emulator/fake-gcs-server
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          BRANDME_REQUIRE_EMULATORS: '1'
        run: |
          python scripts/python/fetch_pubsub_emulator.py
          test -x "$PUBSUB_EMULATOR_BIN"
          python scripts/python/fetch_gcs_emulator.py
          test -x "$GCS_EMULATOR_BIN"
          java -version
          python -m pytest tests -q --timeout=300 -ra --continue-on-collection-errors

      - name: Setup Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Firestore security rules (emulator-evaluated)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          BRANDME_REQUIRE_EMULATORS: '1'
        run: |
          pnpm install --frozen-lockfile --filter @brandme/firestore-rules...
          pnpm --filter @brandme/firestore-rules test 2>&1 | tee .cache/rules.log
          grep -Eq "skipped 0$" .cache/rules.log
          grep -Eq "fail 0$" .cache/rules.log
          grep -Eq "pass [1-9][0-9]*$" .cache/rules.log

  test-consumer-domains:
    name: Test Consumer Domains (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --require-hashes -r scripts/python/requirements.lock

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"

      # Persona, wardrobe, social, rewards and media, including My Data end to end,
      # real Pub/Sub delivery through the foundation outbox worker and the GCS media
      # store on the pinned local GCS emulator (fake-gcs-server).
      - name: Test persona, wardrobe, social, rewards and try-on
        env:
          PUBSUB_EMULATOR_BIN: .cache/pubsub-emulator/platform/pubsub-emulator/bin/cloud-pubsub-emulator
          GCS_EMULATOR_BIN: .cache/gcs-emulator/fake-gcs-server
        run: |
          python scripts/python/fetch_pubsub_emulator.py
          test -x "$PUBSUB_EMULATOR_BIN"
          python scripts/python/fetch_gcs_emulator.py
          test -x "$GCS_EMULATOR_BIN"
          python -m pytest tests/test_persona_*.py tests/test_wardrobe_*.py tests/test_social_*.py tests/test_rewards_*.py tests/test_media_*.py -q --timeout=300 -ra

  # The foundation gate (scripts/brandme.mjs check + smoke): spec validator, contract/token drift, package and
  # gateway type checks and tests, docs links, and the gateway -> brain -> Spanner smoke. The pytest step of
  # `pnpm check` is skipped here only, because test-core runs the same full suite; locally `pnpm check` runs it.
  foundation-check:
    name: Foundation check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
          - 9020:9020
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
      SPANNER_EMULATOR_REST: http://localhost:9020
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      BRANDME_PYTHON: ${{ github.workspace }}/.venv/bin/python
      BRANDME_REQUIRE_EMULATORS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python venv from the hashed lock
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r scripts/python/requirements.lock

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"

      - name: Start pinned Firestore emulator (security-rules suite)
        run: |
          launcher=$(python scripts/python/fetch_firestore_emulator.py .cache/firestore-emulator)
          nohup "$launcher" start --host=127.0.0.1 --port=8080 > .cache/firestore-emulator.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          python -c "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=10).close()"

      - name: pnpm check
        env:
          BRANDME_CHECK_SKIP_PYTHON: '1'
        run: pnpm check

      - name: pnpm smoke (gateway -> brain -> Spanner, restart persistence, outbox)
        run: pnpm smoke

  test-chain:
    name: Test Chain (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc


      - name: Install pnpm
        uses: pnpm/action-setup@v4


      - name: Install dependencies
        working-directory: ./brandme-chain
        run: pnpm install --frozen-lockfile

      - name: Verify chain types and committed artifacts
        working-directory: ./brandme-chain
        run: pnpm type-check && pnpm compact:verify

  # ==========================================
  # Build Docker Images
  # ==========================================


  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-gateway, test-core, test-consumer-domains, foundation-check, test-chain, test-frontend, security-scan]
    timeout-minutes: 40
    # Matrix legs write distinct output names, so the job outputs combine.
    outputs:
      digest-gateway: ${{ steps.publish.outputs.digest-gateway }}
      digest-core: ${{ steps.publish.outputs.digest-core }}
      digest-chain: ${{ steps.publish.outputs.digest-chain }}
      digest-console: ${{ steps.publish.outputs.digest-console }}
    env:
      PUBLISH_IMAGES: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - agents
          - chain
          - console

    steps:
      - uses: actions/checkout@v4

      - name: Read Node toolchain
        id: toolchain
        run: echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/brandme-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./brandme-${{ matrix.service }}/Dockerfile
          build-args: NODE_VERSION=${{ steps.toolchain.outputs.node }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify packaged runtime
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        run: bash .github/scripts/smoke-image.sh "$SERVICE" "${IMAGE_TAGS%%$'\n'*}"

      # Credentials are introduced only after the image has been built and tested.
      - name: Authenticate to Google Cloud
        if: env.PUBLISH_IMAGES == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        if: env.PUBLISH_IMAGES == 'true'
        run: gcloud auth configure-docker --quiet

      - name: Publish verified images
        id: publish
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          digest=""
          while IFS= read -r tag; do
            out=$(docker push "$tag")
            printf '%s\n' "$out"
            pushed=$(printf '%s\n' "$out" | sed -nE 's/^.*: digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' | tail -n 1)
            [[ "$pushed" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "registry reported no digest for $tag" >&2; exit 1; }
            [ -z "$digest" ] || [ "$digest" = "$pushed" ] || { echo "tags of one build resolved to different digests" >&2; exit 1; }
            digest=$pushed
          done <<< "$IMAGE_TAGS"
          echo "digest-${SERVICE}=${digest}" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Deploy to GKE
  # ==========================================

  deploy:
    name: Deploy to GKE (sandbox)
    runs-on: ubuntu-latest
    needs: [build-images]
    # A v* tag alone is not enough: the founder sets the repo variable
    # BM_DEPLOY_ENABLED=true only after every step in
    # docs/build/deploy/gke-verification-packet.md section C is done.
    if: startsWith(github.ref, 'refs/tags/v') && vars.BM_DEPLOY_ENABLED == 'true'
    environment: sandbox
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    timeout-minutes: 30
    # A job-level block replaces the workflow-level one: restate contents.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The env-contract stage feeds the rendered env to the core processes' own
      # validators, so the deploy gate is the same as the 'Deploy manifests' one.
      - name: Setup Python for the env contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install hashed lock
        run: pip install --require-hashes -r scripts/python/requirements.lock

      # Installs pinned, checksum-verified helm/kubeconform into .cache/tools
      # and runs the same offline gate as the 'Deploy manifests' workflow.
      - name: Validate chart offline
        run: BRANDME_PYTHON="$(command -v python)" bash scripts/validate-helm.sh

      - name: Render this exact release (fails on any unfilled REPLACE_ME)
        env:
          DIGEST_GATEWAY: ${{ needs.build-images.outputs.digest-gateway }}
          DIGEST_CORE: ${{ needs.build-images.outputs.digest-core }}
          DIGEST_CHAIN: ${{ needs.build-images.outputs.digest-chain }}
          DIGEST_CONSOLE: ${{ needs.build-images.outputs.digest-console }}
          BM_GCP_PROJECT_ID: ${{ vars.BM_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for d in "$DIGEST_GATEWAY" "$DIGEST_CORE" "$DIGEST_CHAIN" "$DIGEST_CONSOLE"; do
            [[ "$d" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "missing or malformed image digest from build-images" >&2; exit 1; }
          done
          {
            echo "--namespace=brandme"
            echo "--values=brandme-infra/helm/brandme/values-sandbox.yaml"
            echo "--set-string=gcp.projectId=${BM_GCP_PROJECT_ID}"
            echo "--set-string=images.registry=${REGISTRY}/${GCP_PROJECT_ID}"
            echo "--set-string=images.gateway.digest=${DIGEST_GATEWAY}"
            echo "--set-string=images.core.digest=${DIGEST_CORE}"
            echo "--set-string=images.chain.digest=${DIGEST_CHAIN}"
            echo "--set-string=images.console.digest=${DIGEST_CONSOLE}"
          } > "$RUNNER_TEMP/release-args"
          mapfile -t args < "$RUNNER_TEMP/release-args"
          .cache/tools/bin/helm template brandme brandme-infra/helm/brandme "${args[@]}" > "$RUNNER_TEMP/release.yaml"
          grep -c '^kind: Deployment$' "$RUNNER_TEMP/release.yaml"

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.BM_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.BM_GCP_DEPLOYER_SA }}
          project_id: ${{ vars.BM_GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.BM_GKE_CLUSTER }}
          location: ${{ vars.BM_GCP_REGION }}
          project_id: ${{ vars.BM_GCP_PROJECT_ID }}

      # Migrations run first as the chart's pre-install/pre-upgrade hook Job
      # (runner.py up); helm stops before any workload changes if it fails.
      # The namespace is created by the founder (packet C-7), not here.
      - name: Migrate, then roll out by digest
        run: |
          set -euo pipefail
          mapfile -t args < "$RUNNER_TEMP/release-args"
          .cache/tools/bin/helm upgrade --install brandme brandme-infra/helm/brandme "${args[@]}" \
            --wait --wait-for-jobs --timeout 15m --history-max 10
          kubectl -n brandme logs job/brandme-migrations --tail=40

      - name: Verify rollout and in-cluster checks
        run: |
          set -euo pipefail
          for d in gateway chain read-api exports-api exports-worker events-worker; do
            kubectl -n brandme rollout status "deployment/brandme-$d" --timeout=5m
          done
          kubectl -n brandme exec deploy/brandme-read-api -- python -m brandme_core.read_api --check
          kubectl -n brandme exec deploy/brandme-exports-worker -- python -m brandme_core.privacy_exports --check
          kubectl -n brandme exec deploy/brandme-events-worker -- python -m brandme_core.events.worker --check

      - name: Diagnostics on failure (no secret values)
        if: failure()
        run: |
          kubectl -n brandme get deploy,pods,jobs -o wide || true
          kubectl -n brandme get events --sort-by=.lastTimestamp | tail -n 60 || true
          .cache/tools/bin/helm -n brandme history brandme --max 5 || true

  # ==========================================
  # Security Scanning
  # ==========================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Blocking gates. Same digest-pinned image as chain-tests.yml, so a local `docker run` of these exact
      # commands reproduces CI. They run on the checkout only (no install), i.e. committed files.
      # --file-patterns adds the hashed venv lock: Trivy's pip analyzer only reads files named requirements.txt.
      # .trivyignore.yaml holds the dated, owned, path-scoped baseline; it is not loaded by the report below.
      - name: Block on fixable CRITICAL vulnerabilities
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          --ignorefile .trivyignore.yaml --file-patterns 'pip:requirements\.lock$' .

      # Repo-wide (the repository is public). trivy-secret.yaml turns off Trivy's built-in allow rules that
      # skip test, example and Markdown paths.
      - name: Block on committed secrets (repo-wide)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          fs --scanners secret --secret-config trivy-secret.yaml --exit-code 1 --no-progress .

      # Report (not a gate): every severity, uploaded to code scanning even when a gate above failed.
      # Action pinned to the commit of its signed v0.36.0 release tag (git ls-remote, 2026-10-23); `version`
      # pins the Trivy release to the one in the image above.
      - name: Run Trivy vulnerability scanner
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_FILE_PATTERNS: 'pip:requirements\.lock$'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          version: 'v0.75.0'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
