name: Build, Test, and Deploy

on:
  # `push` is scoped to the long-lived branches on purpose. It fires on
  # refs/heads/<branch> while `pull_request` fires on refs/pull/N/merge, so
  # listing feature branches here makes every PR build the whole pipeline
  # twice, concurrently, on the same SHA. The two runs do not carry the same
  # token — GitHub restricts security-events:write on pull_request runs — so
  # they can disagree, and whichever finishes last is the result shown.
  # A `concurrency:` group does NOT dedupe them: github.ref differs, so they
  # land in different groups. Mirrors chain-tests.yml:10-11.
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

# Least privilege by default. security-events:write is what
# codeql-action/upload-sarif needs; without it the Security Scan job fails
# with "Resource not accessible by integration" after Trivy has already
# scanned clean.
permissions:
  contents: read
  security-events: write

env:
  GCP_PROJECT_ID: brandme-prod
  GCP_REGION: us-east1
  GKE_CLUSTER: brandme-cluster
  REGISTRY: gcr.io

jobs:
  # ==========================================
  # Lint and Test
  # ==========================================

  test-gateway:
    name: Test Gateway (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        working-directory: ./brandme-gateway
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./brandme-gateway
        run: pnpm lint

      - name: Type check
        working-directory: ./brandme-gateway
        run: pnpm type-check

      # src/config/index.ts:57 parses its zod schema at module load, and
      # oauthClientId/oauthClientSecret/jwtSecret carry no defaults, so the
      # test file throws on import via config/logger.ts. These are CI-only
      # placeholders for that schema check, not credentials. jwtSecret is
      # .min(32), so the value has to clear 32 characters.
      - name: Run tests
        working-directory: ./brandme-gateway
        env:
          OAUTH_CLIENT_ID: test-client-id
          OAUTH_CLIENT_SECRET: test-client-secret
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long
        run: pnpm test

  test-core:
    name: Test Core (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./brandme-core
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || echo "requirements-dev.txt not found"

      - name: Lint
        working-directory: ./brandme-core
        run: |
          ruff check . || echo "Ruff not configured yet"
          black --check . || echo "Black not configured yet"

      - name: Run tests
        working-directory: ./brandme-core
        run: pytest tests/ -v || echo "Tests not implemented yet"

  test-chain:
    name: Test Chain (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        working-directory: ./brandme-chain
        run: pnpm install --frozen-lockfile || echo "Package.json not found yet"

  # ==========================================
  # Build Docker Images
  # ==========================================

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-gateway, test-core, test-chain]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')

    strategy:
      matrix:
        service:
          - gateway
          - core
          - agents
          - chain
          - console

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/brandme-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./brandme-${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Deploy to GKE
  # ==========================================

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Deploy with Helm
        working-directory: ./brandme-infra/helm
        run: |
          helm upgrade --install brandme ./brandme-umbrella \
            --namespace brandme \
            --create-namespace \
            --values values/values-prod.yaml \
            --set-string global.image.tag=${{ github.ref_name }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/brandme-gateway -n brandme
          kubectl rollout status deployment/brandme-core -n brandme
          kubectl rollout status deployment/brandme-agents -n brandme
          kubectl rollout status deployment/brandme-chain -n brandme
          kubectl rollout status deployment/brandme-console -n brandme

  # ==========================================
  # Security Scanning
  # ==========================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
