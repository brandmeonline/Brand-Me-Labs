name: Build, Test, and Deploy

on:
  # `push` is scoped to the long-lived branches on purpose. It fires on
  # refs/heads/<branch> while `pull_request` fires on refs/pull/N/merge, so
  # listing feature branches here makes every PR build the whole pipeline
  # twice, concurrently, on the same SHA. The two runs do not carry the same
  # token — GitHub restricts security-events:write on pull_request runs — so
  # they can disagree, and whichever finishes last is the result shown.
  # A `concurrency:` group does NOT dedupe them: github.ref differs, so they
  # land in different groups. Mirrors chain-tests.yml:10-11.
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

# Least privilege by default. security-events:write is what
# codeql-action/upload-sarif needs; without it the Security Scan job fails
# with "Resource not accessible by integration" after Trivy has already
# scanned clean.
permissions:
  contents: read
  security-events: write

env:
  GCP_PROJECT_ID: lux-realestate-app
  GCP_REGION: us-east1
  GKE_CLUSTER: brandme-cluster
  REGISTRY: gcr.io

jobs:
  # ==========================================
  # Lint and Test
  # ==========================================


  test-gateway:
    name: Test Gateway (Node/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for identity database migrations
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: pip install --require-hashes -r scripts/python/requirements.lock

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        
      - name: Install dependencies
        working-directory: ./brandme-gateway
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./brandme-gateway
        run: pnpm lint

      - name: Type check
        working-directory: ./brandme-gateway
        run: pnpm type-check

      - name: Run tests
        working-directory: ./brandme-gateway
        run: pnpm exec vitest run

  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --filter brandme-frontend...
      - name: Reject production and critical dependency advisories
        run: |
          pnpm audit --prod
          pnpm audit --audit-level=critical
      - name: Build frontend with lint and type checks
        run: pnpm --filter brandme-frontend build

  test-core:
    name: Test Core (Python/FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
        ports:
          - 9010:9010
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
    steps:
      - uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install --require-hashes -r scripts/python/requirements.lock

      - name: Require Spanner emulator
        run: python -c "import socket; socket.create_connection(('localhost', 9010), timeout=10).close()"

      - name: Test foundation, rights, and privacy
        run: python -m pytest tests/foundation tests/test_rights.py tests/test_privacy.py tests/test_rights_cube_filter.py -q --timeout=120 -ra

  test-chain:
    name: Test Chain (Node/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc


      - name: Install pnpm
        uses: pnpm/action-setup@v4


      - name: Install dependencies
        working-directory: ./brandme-chain
        run: pnpm install --frozen-lockfile

      - name: Verify chain types and committed artifacts
        working-directory: ./brandme-chain
        run: pnpm type-check && pnpm compact:verify

  # ==========================================
  # Build Docker Images
  # ==========================================


  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-gateway, test-core, test-chain, test-frontend, security-scan]
    timeout-minutes: 40
    env:
      PUBLISH_IMAGES: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - core
          - agents
          - chain
          - console

    steps:
      - uses: actions/checkout@v4

      - name: Read Node toolchain
        id: toolchain
        run: echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/brandme-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./brandme-${{ matrix.service }}/Dockerfile
          build-args: NODE_VERSION=${{ steps.toolchain.outputs.node }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify packaged runtime
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        run: bash .github/scripts/smoke-image.sh "$SERVICE" "${IMAGE_TAGS%%$'\n'*}"

      # Credentials are introduced only after the image has been built and tested.
      - name: Authenticate to Google Cloud
        if: env.PUBLISH_IMAGES == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        if: env.PUBLISH_IMAGES == 'true'
        run: gcloud auth configure-docker --quiet

      - name: Publish verified images
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  # ==========================================
  # Deploy to GKE
  # ==========================================

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Deploy with Helm
        working-directory: ./brandme-infra/helm
        run: |
          helm upgrade --install brandme ./brandme-umbrella \
            --namespace brandme \
            --create-namespace \
            --values values/values-prod.yaml \
            --set-string global.image.tag=${{ github.ref_name }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/brandme-gateway -n brandme
          kubectl rollout status deployment/brandme-core -n brandme
          kubectl rollout status deployment/brandme-agents -n brandme
          kubectl rollout status deployment/brandme-chain -n brandme
          kubectl rollout status deployment/brandme-console -n brandme

  # ==========================================
  # Security Scanning
  # ==========================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
