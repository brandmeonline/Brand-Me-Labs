# Brand.Me — local stack (owned by the opus-foundation lane).
#
# Port map (docs/design/brandme/06-delivery-verification.md W00). Compose, the
# gateway proxy config and .env.example change together; no service infers
# another's port.
#   consumer (brandme-frontend) 3000   gateway 3001   console 3002
#   brain 8000  policy 8001  orchestrator 8002  knowledge 8003  compliance 8004
#   identity 8005  governance 8006  cube 8007
#   consumer-domains 8010 (inside the gateway's network namespace, not published)
#   spanner emulator 9010 (gRPC) / 9020 (REST)   firestore emulator 8080
#
# BRANDME_MODE selects demo | development | sandbox | production. Every Python
# service runs `python -m brandme_core.config preflight --service <name>` first;
# in sandbox/production a service that still contains a trust-path fake refuses
# to start (docs/build/evidence/w00/trust-path-fixtures.md).
#
# Consumer-domain routes need a dev key pair first (gitignored .dev-keys/):
#   node scripts/dev/consumer-domain-keys.mjs
# Without it consumer-domains refuses to start and the gateway answers 503 on
# those routes.
#
# Profiles: default = emulators + migrate + brain + policy + gateway +
#           consumer-domains + consumer.
#           `--profile legacy` adds orchestrator/cube/agents/governance.
#           `--profile events` adds NATS for the legacy /scan publisher.

name: brandme

x-python-service: &python-service
  build: &python-build
    context: .
    dockerfile_inline: |
      FROM python:3.11.15-slim
      WORKDIR /app
      COPY scripts/python/requirements.lock /tmp/requirements.lock
      RUN pip install --no-cache-dir --require-hashes -r /tmp/requirements.lock
  image: brandme/python-dev:foundation
  volumes:
    - ./:/app:ro
  environment: &python-env
    BRANDME_MODE: ${BRANDME_MODE:-development}
    PYTHONPATH: /app
    SPANNER_EMULATOR_HOST: spanner-emulator:9010
    SPANNER_PROJECT_ID: ${SPANNER_PROJECT_ID:-test-project}
    SPANNER_INSTANCE_ID: ${SPANNER_INSTANCE_ID:-brandme-instance}
    SPANNER_DATABASE_ID: ${SPANNER_DATABASE_ID:-brandme-db}
    FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
    FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-brandme-dev}
    REGION_DEFAULT: us-east1
    BRAIN_SERVICE_URL: http://brain:8000
    POLICY_SERVICE_URL: http://policy:8001
    ORCHESTRATOR_SERVICE_URL: http://orchestrator:8002
    KNOWLEDGE_SERVICE_URL: http://knowledge:8003
    COMPLIANCE_SERVICE_URL: http://compliance:8004
    IDENTITY_SERVICE_URL: http://identity:8005
    GOVERNANCE_SERVICE_URL: http://governance:8006
    CUBE_SERVICE_URL: http://cube:8007
  networks: [brandme_net]
  depends_on:
    spanner-migrate:
      condition: service_completed_successfully

x-node-service: &node-service
  image: node:24.21.0-bookworm-slim
  working_dir: /app
  volumes:
    - ./:/app
    - node_modules:/app/node_modules
  networks: [brandme_net]

services:
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.45
    ports:
      - "9010:9010"
      - "9020:9020"
    networks: [brandme_net]

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    networks: [brandme_net]

  # Creates instance/database if absent and applies versioned migrations
  # through the ledger (brandme-data/spanner/migrations). Fails loudly; never
  # masks a DDL error.
  spanner-migrate:
    <<: *python-service
    depends_on:
      spanner-emulator:
        condition: service_started
    command: ["python", "brandme-data/spanner/migrations/runner.py", "up", "--create-database", "--wait", "60"]

  brain:
    <<: *python-service
    working_dir: /app/brandme-core/brain
    command: ["sh", "-c", "python -m brandme_core.config preflight --service brain && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]

  policy:
    <<: *python-service
    working_dir: /app/brandme-core/policy
    command: ["sh", "-c", "python -m brandme_core.config preflight --service policy && exec uvicorn main:app --host 0.0.0.0 --port 8001"]
    ports: ["8001:8001"]

  orchestrator:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-core/orchestrator
    command: ["sh", "-c", "python -m brandme_core.config preflight --service orchestrator && exec uvicorn worker:app --host 0.0.0.0 --port 8002"]
    ports: ["8002:8002"]

  knowledge:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-agents/knowledge/src
    command: ["sh", "-c", "python -m brandme_core.config preflight --service knowledge && exec uvicorn main:app --host 0.0.0.0 --port 8003"]
    ports: ["8003:8003"]

  compliance:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-agents/compliance/src
    command: ["sh", "-c", "python -m brandme_core.config preflight --service compliance && exec uvicorn main:app --host 0.0.0.0 --port 8004"]
    ports: ["8004:8004"]

  identity:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-agents/identity/src
    command: ["sh", "-c", "python -m brandme_core.config preflight --service identity && exec uvicorn main:app --host 0.0.0.0 --port 8005"]
    ports: ["8005:8005"]

  governance:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-governance/governance_console
    command: ["sh", "-c", "python -m brandme_core.config preflight --service governance && exec uvicorn main:app --host 0.0.0.0 --port 8006"]
    ports: ["8006:8006"]

  cube:
    <<: *python-service
    profiles: [legacy]
    working_dir: /app/brandme-cube
    command: ["sh", "-c", "python -m brandme_core.config preflight --service cube && exec uvicorn src.main:app --host 0.0.0.0 --port 8007"]
    ports: ["8007:8007"]

  # One-shot dependency install into a named volume, from the committed lockfile.
  node-install:
    <<: *node-service
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile"]

  gateway:
    <<: *node-service
    command: ["sh", "-c", "corepack enable && pnpm --filter @brandme/gateway dev"]
    environment:
      BRANDME_MODE: ${BRANDME_MODE:-development}
      PORT: "3001"
      BRAIN_SERVICE_URL: http://brain:8000
      POLICY_SERVICE_URL: http://policy:8001
      SPANNER_EMULATOR_HOST: spanner-emulator:9010
      SPANNER_PROJECT_ID: ${SPANNER_PROJECT_ID:-test-project}
      SPANNER_INSTANCE_ID: ${SPANNER_INSTANCE_ID:-brandme-instance}
      SPANNER_DATABASE_ID: ${SPANNER_DATABASE_ID:-brandme-db}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
      PUBLIC_ORIGINS: http://localhost:3000,http://localhost:3002
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      NATS_URL: ${NATS_URL:-}
      # consumer-domains shares this network namespace (see below).
      CONSUMER_DOMAIN_SERVICE_URL: http://127.0.0.1:8010
    # CONSUMER_DOMAIN_ASSERTION_KEY (private) and CONSUMER_DOMAIN_ASSERTION_KID; gitignored, generated at runtime.
    env_file:
      - path: ./.dev-keys/consumer-domains-gateway.env
        required: false
    ports: ["3001:3001"]
    depends_on:
      node-install:
        condition: service_completed_successfully
      brain:
        condition: service_started

  # Consumer-domain service (python -m brandme_core.domains.persona.app) behind
  # the gateway's ES256 principal assertion. In demo/development it binds
  # 127.0.0.1 only (brandme_core/domains/persona/app.py:130), so it joins the
  # gateway's network namespace: only the gateway reaches it, at 127.0.0.1:8010,
  # and it reaches the Spanner emulator through the gateway's network. Recreate
  # it whenever the gateway container is recreated. No BRANDME_MEDIA_BUCKET here:
  # media and try-on stay unmounted (no storage emulator in this stack).
  consumer-domains:
    build: *python-build
    image: brandme/python-dev:foundation
    volumes:
      - ./:/app:ro
    network_mode: "service:gateway"
    environment:
      <<: *python-env
      ENVIRONMENT: ${BRANDME_MODE:-development}
      PORT: "8010"
      # The gateway's fixed issuer (brandme-gateway/src/services/domains.ts:23).
      CONSUMER_DOMAIN_ASSERTION_ISSUER: brandme-gateway
    # CONSUMER_DOMAIN_ASSERTION_JWKS (public key only); gitignored, generated at runtime.
    env_file:
      - path: ./.dev-keys/consumer-domains-service.env
        required: false
    command: ["sh", "-c", "test -n \"$${CONSUMER_DOMAIN_ASSERTION_JWKS:-}\" || { echo 'consumer-domains: no dev key pair; run node scripts/dev/consumer-domain-keys.mjs' >&2; exit 2; }; python -m brandme_core.config preflight --service consumer_domains && exec python -m brandme_core.domains.persona.app"]
    depends_on:
      spanner-migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  consumer:
    <<: *node-service
    command: ["sh", "-c", "corepack enable && pnpm --filter brandme-frontend exec next dev -p 3000"]
    environment:
      BRANDME_GATEWAY_URL: http://gateway:3001
    ports: ["3000:3000"]
    depends_on:
      node-install:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  nats:
    image: nats:2.10.29-alpine
    profiles: [events]
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    networks: [brandme_net]

volumes:
  node_modules:

networks:
  brandme_net:
    driver: bridge
