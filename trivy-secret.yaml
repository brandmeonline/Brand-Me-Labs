# Trivy secret-scanner config for the BLOCKING repo-wide secret scan in .github/workflows/ci-cd.yml
# (Security Scan job). The repository is public.
#
# Trivy's built-in allow rules skip every path that looks like a test or an example and every Markdown
# file. Checked 2026-10-23 with aquasec/trivy:0.75.0: a planted fake token under tests/ or in a .md file
# was NOT reported with the defaults and WAS reported with this file. Test fixtures, .env*.example files,
# docs and evidence are exactly where a real credential would be pasted by mistake, so those rules are off.
disable-allow-rules:
  - tests
  - examples
  - markdown
  - vendor

# Path-scoped allow rules for verified test fakes. None are needed today: the whole tracked tree at 744d593
# (and the merge results of PR #51, #52 and #54) scans clean with the rules above, including
# brandme-chain test passphrases and local-network seeds, which match no secret rule. If one is ever
# needed, scope it to one path and say why, for example:
#   allow-rules:
#     - id: chain-local-genesis-seed
#       description: "public well-known local devnet seed, not a credential (owner: midnight-rights)"
#       path: ^brandme-chain/tests/fixtures/local-genesis\.json$
