# Development override (owned by the opus-foundation lane).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Adds the operator console on 3002 and forces BRANDME_MODE=development.
# There are no default credentials here: the gateway's dev identity provider
# is a labelled simulation and is refused by the production mode guard.

services:
  brain:
    environment:
      BRANDME_MODE: development
  policy:
    environment:
      BRANDME_MODE: development
  gateway:
    environment:
      BRANDME_MODE: development
      LOG_LEVEL: debug

  console:
    image: node:24.21.0-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "corepack enable && pnpm --filter brandme-console exec next dev -p 3002"]
    environment:
      BRANDME_GATEWAY_URL: http://gateway:3001
    ports: ["3002:3002"]
    networks: [brandme_net]
    depends_on:
      node-install:
        condition: service_completed_successfully
