<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170"><rect width="100%" height="100%" fill="#f5f3ee"/><text x="45" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#232c29">Brand.Me: implemented connections</text><text x="45" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#615b77">STATIC CODE MAP — main ed19dc1; connections are source evidence, not observed deployment</text><rect x="40" y="150" width="470" height="165" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="58" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Consumer browser</text><text x="58" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Next.js UI. Guest onboarding and</text><text x="58" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">spatial data have local stores; member</text><text x="58" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">views use same-origin proxy.</text><rect x="565" y="150" width="470" height="165" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="583" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Browser server boundary</text><text x="583" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">/api/v1 proxy: selected cookie/CSRF</text><text x="583" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">headers; bounded responses; explicit</text><text x="583" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">unconfigured failures.</text><rect x="1090" y="150" width="470" height="165" rx="14" fill="#fff0e8" stroke="#bd5b37" stroke-width="2"/><text x="1108" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Gateway identity boundary</text><text x="1108" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Dev cookie session or OIDC API bearer.</text><text x="1108" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Production browser login composition</text><text x="1108" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">missing.</text><line x1="510" y1="230" x2="565" y2="230" stroke="#68736c" stroke-width="3"/><polygon points="565,230 552.3937405670625,236.08951747755722 552.3937405670625,223.91048252244278" fill="#68736c"/><line x1="1035" y1="230" x2="1090" y2="230" stroke="#68736c" stroke-width="3"/><polygon points="1090,230 1077.3937405670624,236.08951747755722 1077.3937405670624,223.91048252244278" fill="#68736c"/><rect x="40" y="405" width="470" height="180" rx="14" fill="#fff0e8" stroke="#bd5b37" stroke-width="2"/><text x="58" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Guest spatial persistence</text><text x="58" y="481" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">IndexedDB closet, outfits and media.</text><text x="58" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Production/sandbox guard blocks use</text><text x="58" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">until authenticated adapter is</text><text x="58" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">supplied.</text><line x1="270" y1="315" x2="270" y2="405" stroke="#68736c" stroke-width="3"/><polygon points="270,405 263.91048252244275,392.39374056706254 276.08951747755725,392.39374056706254" fill="#68736c"/><rect x="565" y="405" width="470" height="180" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="583" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Consumer domain API</text><text x="583" y="481" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Mounted persona, wardrobe, social and</text><text x="583" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">rewards; signed principal assertions.</text><text x="583" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Candidate sources empty by default.</text><line x1="1260" y1="315" x2="890" y2="405" stroke="#68736c" stroke-width="3"/><polygon points="890,405 900.8098268159731,396.10350382405136 903.688360960107,407.937477527713" fill="#68736c"/><text x="1083.0" y="358.0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#68736c">signed principal</text><rect x="1090" y="405" width="470" height="180" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="1108" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Rights / chain / export</text><text x="1108" y="481" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Mounted reads, scoped exports and chain</text><text x="1108" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">reconciliation. Commands return 503.</text><text x="1108" y="535" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Full account deletion disconnected.</text><line x1="1360" y1="315" x2="1360" y2="405" stroke="#68736c" stroke-width="3"/><polygon points="1360,405 1353.9104825224429,392.39374056706254 1366.0895174775571,392.39374056706254" fill="#68736c"/><rect x="565" y="665" width="470" height="180" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="583" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Spanner → outbox</text><text x="583" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Durable outbox and Pub/Sub publisher</text><text x="583" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">exist. Consumer job/subscriber</text><text x="583" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">composition missing; deployed workers</text><text x="583" y="822" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">unknown.</text><line x1="800" y1="585" x2="800" y2="665" stroke="#68736c" stroke-width="3"/><polygon points="800,665 793.9104825224427,652.3937405670625 806.0895174775573,652.3937405670625" fill="#68736c"/><rect x="1090" y="665" width="470" height="180" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="1108" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Chain / member wallet</text><text x="1108" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Server reconciliation is read-only.</text><text x="1108" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Member signer not mounted. Cardano</text><text x="1108" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">anchoring retired. Network/deployment</text><text x="1108" y="822" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">unknown.</text><line x1="1325" y1="585" x2="1325" y2="665" stroke="#68736c" stroke-width="3"/><polygon points="1325,665 1318.9104825224429,652.3937405670625 1331.0895174775571,652.3937405670625" fill="#68736c"/><rect x="40" y="665" width="470" height="180" rx="14" fill="#fff0e8" stroke="#bd5b37" stroke-width="2"/><text x="58" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Unconnected product paths</text><text x="58" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Commerce, catalog, providers, assistant</text><text x="58" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">routers exist but main gateway does not</text><text x="58" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">mount them.</text><rect x="40" y="925" width="1510" height="175" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="58" y="964" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Observed deployment: UNKNOWN</text><text x="58" y="1001" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">GitHub returned no deployments/environments/releases in the queried repository lists. That is not proof no cloud resources exist. GCP</text><text x="58" y="1028" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">registry publishing in CI is artifact evidence, not an application deployment or meaningful user transaction.</text></svg>