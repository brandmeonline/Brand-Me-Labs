<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect width="100%" height="100%" fill="#f5f3ee"/><text x="45" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#232c29">Brand.Me: intended complete experience</text><text x="45" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#615b77">INTENDED FLOW — October 5 design contract, not a claim of runtime completion</text><rect x="45" y="155" width="325" height="190" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="63" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">1  Explore</text><text x="63" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Guest first. No wallet,</text><text x="63" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">camera or contacts</text><text x="63" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">required.</text><line x1="370" y1="250" x2="440" y2="250" stroke="#68736c" stroke-width="3"/><polygon points="440,250 427.39374056706254,256.08951747755725 427.39374056706254,243.91048252244278" fill="#68736c"/><rect x="440" y="155" width="325" height="190" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="458" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">2  Declare style</text><text x="458" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Inspect and correct</text><text x="458" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">preferences; choose</text><text x="458" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">accessible room/list.</text><line x1="765" y1="250" x2="835" y2="250" stroke="#68736c" stroke-width="3"/><polygon points="835,250 822.3937405670625,256.08951747755725 822.3937405670625,243.91048252244278" fill="#68736c"/><rect x="835" y="155" width="325" height="190" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="853" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">3  First useful result</text><text x="853" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Save an item or outfit;</text><text x="853" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">show recommendation</text><text x="853" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">reasons.</text><line x1="1160" y1="250" x2="1230" y2="250" stroke="#68736c" stroke-width="3"/><polygon points="1230,250 1217.3937405670624,256.08951747755725 1217.3937405670624,243.91048252244278" fill="#68736c"/><rect x="1230" y="155" width="325" height="190" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="1248" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">4  Keep or connect</text><text x="1248" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Device-only choice, or</text><text x="1248" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">verified sign-in and</text><text x="1248" y="285" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">explicit migration.</text><line x1="1390" y1="345" x2="1390" y2="410" stroke="#68736c" stroke-width="3"/><polygon points="1390,410 1383.9104825224429,397.39374056706254 1396.0895174775571,397.39374056706254" fill="#68736c"/><rect x="45" y="410" width="325" height="190" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="63" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">8  Review authority</text><text x="63" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Consent, object access,</text><text x="63" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">reward accounting and</text><text x="63" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">audit trail.</text><line x1="440" y1="505" x2="370" y2="505" stroke="#68736c" stroke-width="3"/><polygon points="370,505 382.60625943293746,498.91048252244275 382.60625943293746,511.08951747755725" fill="#68736c"/><rect x="440" y="410" width="325" height="190" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="458" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">7  Decide together</text><text x="458" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Selected friends; five-</text><text x="458" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">minute window; block,</text><text x="458" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">revoke or decline.</text><line x1="835" y1="505" x2="765" y2="505" stroke="#68736c" stroke-width="3"/><polygon points="765,505 777.6062594329375,498.91048252244275 777.6062594329375,511.08951747755725" fill="#68736c"/><rect x="835" y="410" width="325" height="190" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="853" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">6  Dress and discover</text><text x="853" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Real saved wardrobe feeds</text><text x="853" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">outfits and relevant</text><text x="853" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">candidates.</text><line x1="1230" y1="505" x2="1160" y2="505" stroke="#68736c" stroke-width="3"/><polygon points="1160,505 1172.6062594329376,498.91048252244275 1172.6062594329376,511.08951747755725" fill="#68736c"/><rect x="1230" y="410" width="325" height="190" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="1248" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">5  Return to your data</text><text x="1248" y="486" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Server persistence;</text><text x="1248" y="513" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">account isolation; refresh</text><text x="1248" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">and cross-device use.</text><line x1="208" y1="600" x2="208" y2="665" stroke="#68736c" stroke-width="3"/><polygon points="208,665 201.91048252244278,652.3937405670625 214.08951747755722,652.3937405670625" fill="#68736c"/><rect x="45" y="665" width="325" height="190" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="63" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">9  Authorize action</text><text x="63" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Exact variant, fresh</text><text x="63" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">total, limits, expiry and</text><text x="63" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">trusted approval.</text><line x1="370" y1="760" x2="440" y2="760" stroke="#68736c" stroke-width="3"/><polygon points="440,760 427.39374056706254,766.0895174775573 427.39374056706254,753.9104825224427" fill="#68736c"/><rect x="440" y="665" width="325" height="190" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="458" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">10  External effect</text><text x="458" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Authorized provider or</text><text x="458" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">chain; durable operation</text><text x="458" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">and idempotency.</text><line x1="765" y1="760" x2="835" y2="760" stroke="#68736c" stroke-width="3"/><polygon points="835,760 822.3937405670625,766.0895174775573 822.3937405670625,753.9104825224427" fill="#68736c"/><rect x="835" y="665" width="325" height="190" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="853" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">11  Reconcile</text><text x="853" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Receipts, retries,</text><text x="853" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">cancellation, pending</text><text x="853" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">outcome and operator</text><text x="853" y="822" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">recovery.</text><line x1="1160" y1="760" x2="1230" y2="760" stroke="#68736c" stroke-width="3"/><polygon points="1230,760 1217.3937405670624,766.0895174775573 1217.3937405670624,753.9104825224427" fill="#68736c"/><rect x="1230" y="665" width="325" height="190" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="1248" y="704" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">12  Control your data</text><text x="1248" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Scoped export, correction,</text><text x="1248" y="768" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">deletion and explained</text><text x="1248" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">retained records.</text><rect x="45" y="915" width="1510" height="155" rx="14" fill="#fff0e8" stroke="#bd5b37" stroke-width="2"/><text x="63" y="954" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Every boundary needs a recovery route</text><text x="63" y="991" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Permission denied → explain scope. Session expired → reauthenticate. Provider timeout → show unconfirmed outcome and reconcile.</text><text x="63" y="1018" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Duplicate → return the same operation. User cancels → stop further authorized work; report any effect already committed.</text></svg>