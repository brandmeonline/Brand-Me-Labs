<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><rect width="100%" height="100%" fill="#f5f3ee"/><text x="45" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#232c29">Missing connection: real browser sign-in</text><text x="45" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#615b77">PROPOSED — NOT IMPLEMENTED ON PINNED MAIN; wireframe for J-002 / F-UX-003</text><rect x="65" y="165" width="640" height="580" rx="14" fill="#ffffff" stroke="#b8bdb6" stroke-width="2"/><text x="83" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Connect your account</text><text x="83" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Continue with the approved identity provider. Show</text><text x="83" y="268" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">guest choices before migration; never imply they are</text><text x="83" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">already saved to an account.</text><rect x="105" y="340" width="560" height="90" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="123" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Continue with identity provider</text><text x="105" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#232c29">Keep exploring as a guest</text><text x="105" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#232c29">After verified callback:</text><text x="105" y="603" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">Review what to migrate</text><text x="105" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">Show account and environment</text><text x="105" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">Confirm saved result and return safely</text><rect x="790" y="165" width="640" height="580" rx="14" fill="#fff0e8" stroke="#bd5b37" stroke-width="2"/><text x="808" y="204" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">When the session expires</text><text x="808" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Explain that the last action is unconfirmed until its</text><text x="808" y="268" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">record is refreshed. Never resubmit a purchase</text><text x="808" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">automatically.</text><rect x="830" y="340" width="560" height="90" rx="14" fill="#e9f2e9" stroke="#527458" stroke-width="2"/><text x="848" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Sign in again securely</text><text x="830" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#232c29">Cancel and return to saved state</text><text x="830" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#232c29">Recovery acceptance:</text><text x="830" y="603" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">State / PKCE callback validation</text><text x="830" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">Revoked and expired session tests</text><text x="830" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#232c29">No cross-account draft or data leakage</text><rect x="65" y="805" width="1365" height="140" rx="14" fill="#eeeaf4" stroke="#817294" stroke-width="2"/><text x="83" y="844" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#232c29">Implementation boundary</text><text x="83" y="881" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">Requires IdP integration, secure session creation, recent-auth and recovery logic. This drawing is a proposal, not</text><text x="83" y="908" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#232c29">executable UI.</text></svg>