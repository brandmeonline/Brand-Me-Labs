# Brand.Me credential manifest: one row per secret, credential or secret-shaped
# name that code, CI, templates or deploy scripts reference. Names only: this file
# never holds a value. The repository is public.
#
# Checked by: node scripts/check-credential-manifest.mjs
# Conventions and field meanings: docs/build/security/secrets-conventions.md
# Rotation: docs/build/runbooks/credential-rotation.md
#
# FORMAT. A deliberately small YAML subset that the checker parses itself and that
# any YAML 1.1/1.2 parser reads the same way:
#   - two-space indentation, no tabs, no anchors, tags, block scalars or flow maps;
#   - scalars are plain, 'single-quoted' ('' escapes a quote) or "double-quoted";
#   - quote any value containing ": " or " #", any regex, and anything that looks
#     like a number, date or yes/no; plain true/false/null and integers are typed;
#   - lists are block lists ("- item") or one-line flow lists ("[a, b]");
#     quote flow items that contain ":".
#
# FIELDS (all required unless marked optional)
#   name                 runtime env var name: the code contract, never renamed
#   kind                 what it is (kebab-case)
#   secret               true when the value must be protected
#   lane_owner           fnd | com | dom | rts | ui | ar (lane that owns the contract)
#   consumers            path:line of each line that names it in code or CI
#   templates            optional; path:line of templates, values files or scripts that declare it
#   modes                demo | development | sandbox | production, plus ci and local
#   secret_manager_id    brandme-<mode>-<lane>-<purpose-kebab>, or none
#   github_location      env:<environment>/NAME | env-var:<environment>/NAME |
#                        repo-secret:NAME | repo-var:NAME  (designated, NOT verified:
#                        GitHub secret APIs return 403 from the build environment)
#   validation           anchored regex the value must match, or none
#   distinct_from        names whose values must never equal this one (symmetric)
#   rotation_class       internal-bearer | provider-token | test-wallet-seeds |
#                        signing-key | gcp-keyless | gcp-sa-key-legacy | reference |
#                        not-secret | retire
#   cadence_days         positive integer, or null when rotation is event-driven
#   status               active | planned | legacy-unread | refused
#   created_by_this_lane false everywhere: no credential was created when this
#                        manifest was written
#   notes                optional free text
#
# Re-audited 2026-10-25 on bf31c98 (every row except CONSUMER_DOMAIN_*, which the consumer-domains lane
# keeps): consumer lines re-pointed until the checker reported none moved or stale, statuses checked
# against secrets-conventions.md "Statuses" for the code merged with PR #51 and #56, and a regex scan for
# value-shaped content (PEM bodies, provider-prefixed tokens, 16+ hex, long base64, emails, URL
# credentials) that found only kebab- and snake-case names.
