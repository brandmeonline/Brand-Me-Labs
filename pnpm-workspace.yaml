# Owned by the opus-foundation lane. Toolchain pins: docs/build/compatibility-lock.md
# Registration, lockfile and conflict rules: docs/build/workspace-governance.md
# (enforced by scripts/check-workspace.mjs; every tracked package.json must match a
# glob below or be a STANDALONE entry in that script).
packages:
  - 'brandme-gateway'
  - 'brandme-chain'
  - 'brandme-console'
  - 'brandme-frontend'
  - 'packages/*'

# pnpm 10 blocks dependency lifecycle scripts unless allowlisted.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - protobufjs
  - '@parcel/watcher'
  - sharp

engineStrict: false

overrides:
  "@midnight-ntwrk/ledger-v8": "8.1.2"
  "@midnight-ntwrk/onchain-runtime-v3": "3.0.0"
  "@midnight-ntwrk/compact-runtime": "0.16.0"
  "@midnight-ntwrk/compact-js": "2.5.1"
  "@midnight-ntwrk/platform-js": "2.2.4"

  # Upstream critical worker-options pollution fixes; validated with the pinned Vitest suites.
  "tinypool": "2.1.2"
  "minimatch@9": "9.0.7"
  "postcss@8": "8.5.23"
  "@babel/core@7": "7.29.6"
  # firebase 13.1.0 (dev-only, @brandme/firestore-rules) pins grpc-js ~1.9, which is
  # affected by GHSA high/low advisories fixed in >=1.13.6. Dedupe onto the
  # workspace's existing 1.14.6; validated by the emulator rules suite.
  "@grpc/grpc-js@1.9": "1.14.6"
