{{- /*
Copyright (c) Brand.Me, Inc. All rights reserved.
Console: brandme-console/Dockerfile runtime (Next.js standalone, node uid
1000), port 3002, GET / (.github/scripts/smoke-image.sh console check).
NEXT_PUBLIC_* API URLs are baked at image build time and CI passes none
(brandme-console/lib/api.ts:11-14), so runtime env cannot point the browser at
the gateway. The pod needs no Google identity. Next.js writes its image cache
under .next/cache, which gets an emptyDir.
*/ -}}
{{- if .Values.console.enabled }}
{{- $c := .Values.console }}
{{- $name := include "brandme.componentName" (list . "console") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "brandme.labels" (list . "console") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "brandme.selectorLabels" (list . "console") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        {{- include "brandme.labels" (list . "console") | nindent 8 }}
      {{- with .Values.podDefaults.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "brandme.podDefaults" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "brandme.podSecurityContext" (list . 1000) | nindent 8 }}
      containers:
        - name: console
          image: {{ include "brandme.image" (list . "console") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["node", "brandme-console/server.js"]
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          env:
            {{- include "brandme.modeEnv" . | nindent 12 }}
            - name: PORT
              value: {{ $c.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{- include "brandme.preStop" . | nindent 10 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- include "brandme.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "brandme.tmpMount" . | nindent 12 }}
            - name: next-cache
              mountPath: /app/brandme-console/.next/cache
      volumes:
        {{- include "brandme.tmpVolume" . | nindent 8 }}
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "brandme.labels" (list . "console") | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: {{ printf "{\"default\": \"%s\"}" $name | squote }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "brandme.selectorLabels" (list . "console") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.port }}
      targetPort: http
      protocol: TCP
{{- end }}
