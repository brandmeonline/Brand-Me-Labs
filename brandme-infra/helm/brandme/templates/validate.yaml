{{- /*
Copyright (c) Brand.Me, Inc. All rights reserved.
Renders nothing. Fails the whole render on values that must never deploy.
*/ -}}
{{- if contains "REPLACE_ME" (toYaml .Values) -}}
{{- fail "values still contain REPLACE_ME placeholders: fill every one (values-sandbox.yaml lists them) before rendering" -}}
{{- end -}}
{{- $mode := include "brandme.mode" . -}}
{{- if and .Values.ingress.enabled (not .Values.gateway.enabled) -}}
{{- fail "ingress.enabled requires gateway.enabled" -}}
{{- end -}}
{{- if .Values.gateway.enabled -}}
{{- range .Values.gateway.publicOrigins -}}
{{- if not (hasPrefix "https://" .) -}}
{{- fail (printf "gateway.publicOrigins entry %q must be https in strict modes (brandme-gateway/src/middleware/mode.ts:47)" .) -}}
{{- end -}}
{{- end -}}
{{- if not .Values.gateway.publicOrigins -}}
{{- fail "gateway.publicOrigins is required (the gateway default is http://localhost, refused in strict modes)" -}}
{{- end -}}
{{- end -}}
{{- if or .Values.exportsApi.enabled .Values.exportsWorker.enabled -}}
{{- $bucket := include "brandme.req" (list .Values.privacyExports.bucket "privacyExports.bucket") -}}
{{- if not (hasPrefix (printf "brandme-%s-exports-" $mode) $bucket) -}}
{{- fail (printf "privacyExports.bucket %q must start with brandme-%s-exports- (brandme_core/privacy_exports/config.py:82)" $bucket $mode) -}}
{{- end -}}
{{- end -}}
{{- if .Values.eventsWorker.enabled -}}
{{- $topics := list .Values.eventsWorker.topics.public .Values.eventsWorker.topics.memberPrivate .Values.eventsWorker.topics.restricted -}}
{{- range $i, $t := $topics -}}
{{- $id := include "brandme.req" (list $t "eventsWorker.topics.*") -}}
{{- if not (hasPrefix (printf "brandme-%s-" $mode) $id) -}}
{{- fail (printf "eventsWorker topic %q must start with brandme-%s- (brandme_core/events/pubsub.py:51-53)" $id $mode) -}}
{{- end -}}
{{- end -}}
{{- if ne (len (uniq $topics)) 3 -}}
{{- fail "eventsWorker.topics must be three distinct topics" -}}
{{- end -}}
{{- end -}}
