{{- /*
Copyright (c) Brand.Me, Inc. All rights reserved.
One Kubernetes ServiceAccount per workload, each linked to its own Google
service account through Workload Identity Federation for GKE. The binding
(roles/iam.workloadIdentityUser for
serviceAccount:<project>.svc.id.goog[<namespace>/<this name>]) is created
outside the chart: docs/build/deploy/gke-verification-packet.md section C.
The console gets an identity with no Google service account.
The migration ServiceAccount is a hook resource (templates/migrations-job.yaml).
*/ -}}
{{- $root := . -}}
{{- $workloads := list
      (list "gateway" "gateway" .Values.gateway)
      (list "chain" "chain" .Values.chain)
      (list "read-api" "readApi" .Values.readApi)
      (list "exports-api" "exportsApi" .Values.exportsApi)
      (list "exports-worker" "exportsWorker" .Values.exportsWorker)
      (list "events-worker" "eventsWorker" .Values.eventsWorker) -}}
{{- range $w := $workloads }}
{{- $component := index $w 0 }}
{{- $cfg := index $w 2 }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "brandme.componentName" (list $root $component) }}
  labels:
    {{- include "brandme.labels" (list $root $component) | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ include "brandme.gsaEmail" (list $root $cfg.gcpServiceAccount (printf "%s.gcpServiceAccount" (index $w 1))) | quote }}
automountServiceAccountToken: {{ $root.Values.podDefaults.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- if .Values.console.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "brandme.componentName" (list $root "console") }}
  labels:
    {{- include "brandme.labels" (list $root "console") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
