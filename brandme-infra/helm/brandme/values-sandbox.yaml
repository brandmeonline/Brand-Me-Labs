#
# First deploy target: BRANDME_MODE=sandbox (Midnight Preprod, no Mainnet).
# Names follow docs/build/deploy/gke-verification-packet.md section C. Every
# REPLACE_ME is a founder decision or a value that only exists after a cloud
# step; rendering FAILS while any remains (templates/validate.yaml), so a
# half-filled file cannot be deployed. No secret values belong here — only the
# names of Kubernetes Secrets synced from Secret Manager.
#
# images.registry and images.<name>.digest are deliberately unset: the deploy
# job passes them from the build-images job outputs (deploy by digest).
mode: sandbox

gcp:
  # D1: lux-realestate-app (where CI pushes today) or a dedicated project.
  projectId: REPLACE_ME_GCP_PROJECT_ID
  region: us-east1

spanner:
  instanceId: brandme-sandbox
  databaseId: brandme-sandbox

midnight:
  network: preprod
  # 64 lowercase hex address of the rights contract deployed on Preprod
  # (none exists yet: docs/build/evidence/midnight-integration-2026-10-22.md).
  contractAddress: REPLACE_ME_PREPROD_CONTRACT_ADDRESS

secretRefs:
  rightsServiceToken: {name: brandme-sandbox-rts-rights-service-token}
  privacyServiceToken: {name: brandme-sandbox-rts-privacy-service-token}
  privacyExportServiceToken: {name: brandme-sandbox-rts-privacy-export-service-token}
  chainServiceToken: {name: brandme-sandbox-rts-chain-service-token}
  midnightBlockfrostProjectId: {name: brandme-sandbox-rts-midnight-blockfrost-project-id}

gateway:
  gcpServiceAccount: bm-sbx-fnd-gateway
  oidc:
    # D5: the OIDC identity provider the gateway trusts (https only).
    issuer: REPLACE_ME_OIDC_ISSUER_HTTPS_URL
    audience: REPLACE_ME_OIDC_AUDIENCE
  # D6: the browser origins allowed to make cookie-authenticated requests.
  publicOrigins:
    - https://REPLACE_ME_PUBLIC_APP_ORIGIN

chain:
  gcpServiceAccount: bm-sbx-rts-chain

# Off until the console image bakes real NEXT_PUBLIC_* gateway URLs at build
# time (packet gap G7); today it would send browsers to http://localhost.
console:
  enabled: false

readApi:
  gcpServiceAccount: bm-sbx-rts-read-api

exportsApi:
  gcpServiceAccount: bm-sbx-rts-export-api

exportsWorker:
  gcpServiceAccount: bm-sbx-rts-export-wkr

privacyExports:
  # Bucket names are global: pick a suffix when creating it (packet C-9).
  bucket: brandme-sandbox-exports-REPLACE_ME_SUFFIX

eventsWorker:
  gcpServiceAccount: bm-sbx-fnd-outbox
  topics:
    public: brandme-sandbox-public
    memberPrivate: brandme-sandbox-member-private
    restricted: brandme-sandbox-restricted

# Reuses the outbox identity (Spanner data read/write); its Pub/Sub grants are
# unused here. Needs its own Workload Identity binding for
# serviceAccount:<project>.svc.id.goog[brandme/brandme-events-retention].
eventsRetention:
  gcpServiceAccount: bm-sbx-fnd-outbox

# Runs `runner.py up` before every rollout. Do not enable the deploy until the
# migration-numbering decision (D3: V003-V005 on the consumer-domains branch)
# is executed — once V006+ are applied, lower versions can never be applied in
# sandbox (runner.py:195-202, :294-295).
migrations:
  gcpServiceAccount: bm-sbx-fnd-migrator

ingress:
  enabled: false
