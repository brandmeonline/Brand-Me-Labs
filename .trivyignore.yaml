# Trivy baseline for the BLOCKING vulnerability gate in .github/workflows/ci-cd.yml (Security Scan job:
# CRITICAL, fix available, repo filesystem). Only that step reads this file (--ignorefile .trivyignore.yaml);
# the SARIF report uploaded to code scanning still lists these findings. A plain .trivyignore is not used
# on purpose: Trivy loads that file by default, so it would also hide these alerts from the SARIF report,
# and it cannot scope an ID to one file.
#
# Rules for every entry: path-scoped, an owner lane, an expiry, a reason. Trivy stops honouring an entry
# after expired_at, so the gate turns red on that date unless the owner fixes or re-justifies it. Delete
# the entry in the PR that fixes it.
#
# Baseline taken 2026-10-23 at 744d593 with aquasec/trivy:0.75.0
# (sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa), scanning with
# --file-patterns 'pip:requirements\.lock$' so the hashed venv lock that CI installs is included (Trivy's
# default pip analyzer only reads files named requirements.txt). These five were the only CRITICAL, fixable
# findings; the merge results of PR #51, #52 and #54 add none.
vulnerabilities:
  # owner: foundation expires: 2026-11-30 reason: anyio 3.7.1 in the CI/dev venv lock is held below 4.0
  # by fastapi==0.104.1 (brandme_core/requirements.txt). Fix needs the fastapi/starlette upgrade, then a lock
  # recompile; starlette 0.27.0 in the same lock also has fixable HIGH findings.
  - id: CVE-2026-63374
    paths:
      - "scripts/python/requirements.lock"
    expired_at: 2026-11-30
    statement: "owner foundation; anyio pinned <4 by fastapi 0.104.1; fix with the fastapi upgrade"
  # owner: foundation expires: 2026-11-30 reason: certifi 2026.7.22 in the venv lock; fixed in
  # 2026.10.19. A lock-only refresh, deferred because the change that added this baseline was limited to
  # adding the four commerce pins to the lock.
  - id: GHSA-6q48-6c7w-9gw2
    paths:
      - "scripts/python/requirements.lock"
    expired_at: 2026-11-30
    statement: "owner foundation; certifi lock refresh to >=2026.10.19 pending"
  # owner: unowned-legacy expires: 2026-11-30 reason: python-jose 3.3.0 is declared but imported nowhere in
  # the repo; brandme-core/Dockerfile installs this file into the core image. Fix: drop it or pin >=3.4.0.
  - id: CVE-2024-33663
    paths:
      - "brandme-core/requirements.txt"
    expired_at: 2026-11-30
    statement: "owner unowned-legacy; unused python-jose 3.3.0; fix by removal or >=3.4.0"
  # owner: unowned-legacy expires: 2026-11-30 reason: same unused python-jose 3.3.0 pin in the cube service
  # (CLAUDE.md marks brandme-cube STUB/UNVERIFIED). Fix: drop it or pin >=3.4.0.
  - id: CVE-2024-33663
    paths:
      - "brandme-cube/requirements.txt"
    expired_at: 2026-11-30
    statement: "owner unowned-legacy; unused python-jose 3.3.0; fix by removal or >=3.4.0"
  # owner: unowned-legacy expires: 2026-11-30 reason: sentence-transformers 2.3.1 is declared but imported
  # nowhere; the agentic CLI is not a deployed service. Fix: drop it or pin >=5.6.0.
  - id: CVE-2026-68770
    paths:
      - "brandme-agents/agentic/requirements.txt"
    expired_at: 2026-11-30
    statement: "owner unowned-legacy; unused sentence-transformers 2.3.1; fix by removal or >=5.6.0"
