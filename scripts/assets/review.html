<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Brand.Me asset camera review</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/tools/node_modules/three/build/three.module.js",
          "three/addons/": "/tools/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as T from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      const scene = new T.Scene(),
        renderer = new T.WebGLRenderer({
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
        });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      document.body.append(renderer.domElement);
      const loader = new GLTFLoader();
      const load = async (url) => {
        const asset = await loader.loadAsync(url);
        asset.scene.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        return asset.scene;
      };
      const q = new URLSearchParams(location.search),
        asset = await load(q.get("asset"));
      scene.add(asset);
      const isRoom = q.has("room");
      let camera;
      const hemi = new T.HemisphereLight("#fff8e8", "#797567", 2.1);
      scene.add(hemi);
      const key = new T.DirectionalLight("#fff2db", 4);
      key.position.set(-3, 4, 4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      key.shadow.bias = -0.0003;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      const fill = new T.DirectionalLight("#e8efff", 1.5);
      fill.position.set(4, 2, 1);
      scene.add(fill);
      if (isRoom) {
        scene.background = new T.Color("#EDE6D9");
        camera = new T.PerspectiveCamera(
          38,
          innerWidth / innerHeight,
          0.05,
          40,
        );
        camera.position.set(0, 1.55, 4.8);
        camera.lookAt(0, 1.35, 0);
        const garden = q.get("room") === "garden_studio";
        const items = [
          ["overshirt", [-1.88, 1.75, -0.65], 0.35],
          ["tee", [-1.36, 1.75, -0.65], 0.32],
          ["jacket", [-0.85, 1.75, -0.65], 0.35],
          ["dress", garden ? [-1.12, 1.75, -0.65] : [1.22, 1.75, -0.65], 0.18],
          ["trousers", garden ? [1.3, 1.49, -1.13] : [1.83, 1.75, -0.65], 0.4],
          ["bag", [1.45, 0.87, 0.4], 0],
          ["sneaker", garden ? [-1.35, 0.2, -0.87] : [0, 0.24, -1.12], 0],
        ];
        for (const [slug, pos, yaw] of items) {
          if (garden && ["dress", "trousers"].includes(slug)) continue;
          const item = await load(`/demo/garments/${slug}/lod1.glb`);
          item.position.set(...pos);
          item.rotation.y = yaw;
          scene.add(item);
        }
      } else {
        const bounds = new T.Box3().setFromObject(asset),
          size = bounds.getSize(new T.Vector3()),
          center = bounds.getCenter(new T.Vector3());
        camera = new T.PerspectiveCamera(
          32,
          innerWidth / innerHeight,
          0.01,
          10,
        );
        const distance =
          Math.max(
            size.y / (2 * Math.tan((16 * Math.PI) / 180)),
            size.x /
              (2 * Math.tan((16 * Math.PI) / 180) * (innerWidth / innerHeight)),
          ) * 1.16;
        camera.position.set(
          center.x + distance * 0.17,
          center.y + distance * 0.035,
          center.z + distance,
        );
        camera.lookAt(center);
      }
      renderer.render(scene, camera);
      await new Promise(requestAnimationFrame);
      renderer.render(scene, camera);
      window.assetReview = {
        ready: true,
        triangles: renderer.info.render.triangles,
        calls: renderer.info.render.calls,
        textureCount: renderer.info.memory.textures,
        webp: () => renderer.domElement.toDataURL("image/webp", 0.93),
      };
    </script>
  </body>
</html>
